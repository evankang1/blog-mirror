name: Sync Naver Blog Mirror

on:
  push:
    branches: ["main"]
  schedule:
    # KST 09:10 = UTC 00:10
    - cron: "10 0 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Regenerate mirror site and sanitize output
        env:
          PAGES_BASE_URL: https://evankang1.github.io/blog-mirror/
        run: |
          python scripts/sync.py
          python - <<'PY'
          import re
          from pathlib import Path

          def sanitize(path: Path):
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'(?m)^<<<<<<<.*\n?', '', text)
              text = re.sub(r'(?m)^=======\n?', '', text)
              text = re.sub(r'(?m)^>>>>>>>.*\n?', '', text)
              text = re.sub(r'<script[^>]*>.*?</script>', '', text, flags=re.DOTALL | re.IGNORECASE)
              text = re.sub(r'<script[^>]*/?>\s*', '', text, flags=re.IGNORECASE)
              text = text.replace('</script>', '')
              path.write_text(text, encoding='utf-8')

          for target in [Path('index.html'), Path('sitemap.xml'), Path('robots.txt')]:
              if target.exists():
                  sanitize(target)
          print('Generated and sanitized static pages')
          PY

      - name: Validate generated sitemap and HTML
        run: |
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          assert '<<<<<<<' not in html and '>>>>>>>' not in html, 'merge markers remain in index.html'
          assert '<script' not in html.lower(), 'script tags remain in index.html'

          sitemap_path = Path('sitemap.xml')
          xml = sitemap_path.read_text(encoding='utf-8')
          assert '<<<<<<<' not in xml and '>>>>>>>' not in xml, 'merge markers remain in sitemap.xml'
          assert '<script' not in xml.lower(), 'script tags remain in sitemap.xml'

          namespace = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          root = ET.parse(sitemap_path).getroot()
          assert root.tag == f'{namespace}urlset', 'Invalid sitemap root'
          urls = root.findall(f'{namespace}url')
          assert urls, 'sitemap.xml contains no URLs'
          assert all(url.find(f'{namespace}loc') is not None for url in urls), 'Sitemap loc entries missing'
          print(f'Validated generated pages: {len(urls)} URLs')
          PY

      - name: Commit and push regenerated mirror files
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions"
          git add -A
          git diff-index --quiet HEAD || (git commit -m "mirror site auto-sync $(date '+%Y-%m-%d %H:%M:%S')" && git push)
