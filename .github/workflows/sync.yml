name: Sync Naver Blog Mirror

on:
  push:
    branches: ["main"]
  schedule:
    # KST 09:10 = UTC 00:10
    - cron: "10 0 * * *"
  workflow_dispatch:

jobs:
  sync:
    name: Regenerate mirror and publish clean static output
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch RSS and regenerate mirror pages
        env:
          PAGES_BASE_URL: https://evankang1.github.io/blog-mirror/
        run: |
          python scripts/sync.py

      - name: Sanitize generated HTML and XML output
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          def sanitize(path: Path):
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'(?m)^<<<<<<<.*\n?', '', text)
              text = re.sub(r'(?m)^=======\n?', '', text)
              text = re.sub(r'(?m)^>>>>>>>.*\n?', '', text)
              text = re.sub(r'(?is)<\s*script\b[^>]*>.*?</\s*script\s*>', '', text)
              text = re.sub(r'(?is)<\s*script\b[^>]*?/?>', '', text)
              text = re.sub(r'(?is)</\s*script\s*>', '', text)
              path.write_text(text, encoding='utf-8')

          # Include versioned sitemaps too: robots.txt may refer to a file
          # created in the same run.
          targets = [Path('index.html'), Path('robots.txt'), *Path('.').glob('sitemap*.xml')]
          for target in targets:
              if target.exists():
                  sanitize(target)
          print('Generated and sanitized static pages')
          PY

      - name: Validate generated sitemap and HTML
        run: |
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          assert '<<<<<<<' not in html and '>>>>>>>' not in html, 'merge markers remain in index.html'
          assert '<script' not in html.lower(), 'script tags remain in index.html'

          namespace = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          for sitemap_path in Path('.').glob('sitemap*.xml'):
              xml = sitemap_path.read_text(encoding='utf-8')
              assert '<<<<<<<' not in xml and '>>>>>>>' not in xml, f'merge markers remain in {sitemap_path}'
              assert '<script' not in xml.lower(), f'script tags remain in {sitemap_path}'

              root = ET.parse(sitemap_path).getroot()
              assert root.tag == f'{namespace}urlset', f'Invalid sitemap root in {sitemap_path}'
              # Reject every direct child other than a sitemap <url>, rather
              # than merely looking for the string "<script".
              assert all(child.tag == f'{namespace}url' for child in root), f'Unexpected sitemap element in {sitemap_path}'
              urls = root.findall(f'{namespace}url')
              assert urls, f'{sitemap_path} contains no URLs'
              assert all(url.find(f'{namespace}loc') is not None for url in urls), f'Sitemap loc entries missing in {sitemap_path}'
              print(f'Validated {sitemap_path}: {len(urls)} URLs')
          PY

      - name: Commit regenerated output back to main
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions"
          git add -A
          git diff-index --quiet HEAD || (git commit -m "mirror site auto-sync $(date '+%Y-%m-%d %H:%M:%S')" && git push)
