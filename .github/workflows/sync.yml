name: Sync Naver Blog to GitHub Pages

on:
  schedule:
    # KST 09:00 = UTC 00:00
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run sync script
        env:
          PAGES_BASE_URL: https://evankang1.github.io/blog-mirror/
        run: python scripts/sync.py

      - name: Validate sitemap
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          namespace = "{http://www.sitemaps.org/schemas/sitemap/0.9}"
          root = ET.parse("sitemap.xml").getroot()
          assert root.tag == f"{namespace}urlset"
          urls = root.findall(f"{namespace}url")
          assert urls, "sitemap.xml contains no URLs"
          assert all(url.find(f"{namespace}loc") is not None for url in urls)
          assert not root.findall(".//script")
          print(f"Validated sitemap.xml: {len(urls)} URLs")
          PY
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions"
          git add -A
          git diff-index --quiet HEAD || (git commit -m "mirror site auto-sync $(date '+%Y-%m-%d %H:%M:%S')" && git push)
